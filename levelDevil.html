<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Devil</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }

  #gameWrapper {
    position: relative;
    width: 800px;
    max-width: 100vw;
  }

  canvas {
    display: block;
    width: 800px;
    max-width: 100vw;
    height: auto;
    image-rendering: pixelated;
    border: 4px solid #8b2500;
    box-shadow: 0 0 40px #ff4400aa, 0 0 80px #ff220044;
  }

  #ui {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #2a0800;
    border: 4px solid #8b2500;
    border-top: none;
  }

  #ui span {
    color: #ffaa44;
    font-size: 9px;
    letter-spacing: 1px;
  }

  #deathCount { color: #ff4444 !important; }

  /* Screens */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,2,0,0.92);
    z-index: 10;
    gap: 20px;
  }

  .screen h1 {
    font-size: 28px;
    color: #ff6600;
    text-shadow: 0 0 20px #ff4400, 3px 3px 0 #8b1a00;
    letter-spacing: 4px;
    animation: flicker 2s infinite;
  }

  .screen h2 {
    font-size: 14px;
    color: #ffaa44;
    text-shadow: 2px 2px 0 #8b3300;
  }

  .screen p {
    font-size: 8px;
    color: #cc7733;
    text-align: center;
    line-height: 2;
    max-width: 500px;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    background: #8b2500;
    color: #ffdd88;
    border: 3px solid #ff6600;
    padding: 12px 28px;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.1s;
    box-shadow: 4px 4px 0 #3a0d00;
    text-transform: uppercase;
  }

  .btn:hover {
    background: #cc3300;
    box-shadow: 6px 6px 0 #3a0d00;
    transform: translate(-1px, -1px);
  }

  .btn:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 #3a0d00;
  }

  @keyframes flicker {
    0%,100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.4; }
    94% { opacity: 1; }
    96% { opacity: 0.6; }
    97% { opacity: 1; }
  }

  #devilEmoji {
    font-size: 48px;
    animation: devilBounce 1s ease-in-out infinite;
  }

  @keyframes devilBounce {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }

  .levelBtns {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 420px;
  }

  .lvlBtn {
    font-family: 'Press Start 2P', monospace;
    background: #3a0d00;
    color: #ffaa44;
    border: 2px solid #8b2500;
    padding: 10px 6px;
    font-size: 8px;
    cursor: pointer;
    transition: all 0.1s;
  }

  .lvlBtn:hover { background: #8b2500; color: #fff; }
  .lvlBtn.locked { color: #553322; border-color: #3a1500; cursor: not-allowed; }

  .hint {
    font-size: 7px;
    color: #ff4444;
    text-align: center;
    animation: pulse 1.5s infinite;
    max-width: 480px;
    line-height: 2;
  }

  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

  .controls-info {
    font-size: 7px;
    color: #886644;
    text-align: center;
    line-height: 2.2;
  }

  /* Mobile controls */
  #mobileControls {
    display: none;
    justify-content: space-between;
    padding: 10px;
    background: #1a0500;
    border: 4px solid #8b2500;
    border-top: none;
    gap: 10px;
  }

  .mBtn {
    background: #3a0d00;
    border: 2px solid #8b2500;
    color: #ffaa44;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    padding: 14px 22px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    border-radius: 4px;
  }

  .mBtn:active { background: #8b2500; }

  @media (max-width: 820px) {
    #mobileControls { display: flex; }
    #gameWrapper { width: 100vw; }
    canvas { width: 100vw; }
  }
</style>
</head>
<body>

<div id="gameWrapper">

<div class="screen" id="levelScreen" style="display:none">

  const L = LEVELS[state.level];
  player = {

    w: 14,
    h: 24,
    vx: 0,
    vy: 0,
    onGround: false,
    dead: false,
    won: false,
    facingRight: true,
    walkFrame: 0,
    walkTimer: 0,
    deathTimer: 0,
    squish: 1,
  };
  gravDir = 1;
  liveArrows = [];
  frameCount = 0;

  const L2 = LEVELS[state.level];

  // Init moving platforms
  liveMovPlatforms = (L2.movingPlatforms||[]).map(p => ({...p, cx:p.x, cy:p.oy||p.y, fallen:false, fallTimer:0, onPlayer:false}));

  // Init crushers
  liveCrushers = (L2.crushers||[]).map(c => ({...c, cy:c.oy, dir:1, t: c.phase||0}));

  // Init saws
  liveSaws = (L2.saws||[]).map(s => ({...s, cx:s.x, cy:s.y, angle:0}));

  // Hidden platforms
  liveHiddenPlatforms = (L2.hiddenPlatforms||[]).map(p => ({...p, revealed:false, revTimer:0}));

  // Grav pads
  liveGravPads = (L2.gravPads||[]).map(g => ({...g}));
}

function initLevel() {
  resetPlayer();
  gameActive = true;
  state.deaths = 0;
  state.startTime = Date.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gameActive && !player.dead && !player.won) {
      state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
      document.getElementById('timeLabel').textContent = `TIME: ${state.elapsed}s`;
    }
  }, 250);
}

// ─── INPUT ──────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR' && gameActive) { killPlayer(true); }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Mobile
document.getElementById('mLeft').addEventListener('touchstart',  () => keys['ArrowLeft']  = true);
document.getElementById('mLeft').addEventListener('touchend',    () => keys['ArrowLeft']  = false);
document.getElementById('mRight').addEventListener('touchstart', () => keys['ArrowRight'] = true);
document.getElementById('mRight').addEventListener('touchend',   () => keys['ArrowRight'] = false);
document.getElementById('mJump').addEventListener('touchstart',  () => keys['ArrowUp']    = true);
document.getElementById('mJump').addEventListener('touchend',    () => keys['ArrowUp']    = false);

// ─── PHYSICS & COLLISION ────────────────────────────────────
const GRAVITY   = 0.55;
const JUMP_FORCE = -11;
const MOVE_SPEED = 3.8;

function getAllPlatforms() {
  const L = LEVELS[state.level];
  const statics = (L.platforms||[]).map(p => ({x:p.x, y:p.y, w:p.w, h:p.h, solid:true}));
  const moving  = liveMovPlatforms.filter(p => !p.fallen).map(p => ({
    x: p.cx, y: p.cy, w: p.w, h: p.h, solid:true, moving:true, ref:p
  }));
  const hidden  = liveHiddenPlatforms.map(p => ({x:p.x, y:p.y, w:p.w, h:p.h, solid:true, hidden:true, ref:p}));
  return [...statics, ...moving, ...hidden];
}

function rectOverlap(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function updatePlayer() {
  if (player.dead || player.won) return;

  const L = LEVELS[state.level];
  const grav = GRAVITY * gravDir;

  // Horizontal
  let moveX = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) { moveX = -MOVE_SPEED; player.facingRight = false; }
  if (keys['ArrowRight'] || keys['KeyD']) { moveX =  MOVE_SPEED; player.facingRight = true; }
  player.vx = moveX;

  // Jump
  const jumpPress = keys['ArrowUp'] || keys['KeyW'] || keys['Space'];
  if (jumpPress && player.onGround) {
    player.vy = JUMP_FORCE * gravDir;
    player.onGround = false;
    player.squish = 0.6;
  }

  // Apply gravity
  player.vy += grav;
  player.vy = Math.max(-16, Math.min(16, player.vy));

  // Squish recovery
  player.squish += (1 - player.squish) * 0.25;

  // Move X
  player.x += player.vx;
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // Collide X with platforms
  const platforms = getAllPlatforms();
  for (const p of platforms) {
    if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }

  // Move Y
  player.y += player.vy;
  player.onGround = false;

  // Collide Y
  for (const p of platforms) {
    if (rectOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (gravDir === 1) {
        if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.onGround = true; }
        else               { player.y = p.y + p.h;       player.vy = 0; }
      } else {
        if (player.vy < 0) { player.y = p.y + p.h;       player.vy = 0; player.onGround = true; }
        else               { player.y = p.y - player.h;  player.vy = 0; }
      }
      if (p.hidden && p.ref) { p.ref.revealed = true; p.ref.revTimer = 180; }
    }
  }

  // Clamp to world
  if (player.y > H + 50 || player.y < -60) killPlayer();

  // Walk animation
  if (moveX !== 0 && player.onGround) {
    player.walkTimer++;
    if (player.walkTimer > 6) { player.walkFrame = (player.walkFrame + 1) % 4; player.walkTimer = 0; }
  } else {
    player.walkFrame = 0;
  }

  // Grav pads
  for (const g of liveGravPads) {
    if (rectOverlap(player.x, player.y, player.w, player.h, g.x, g.y, 24, 16)) {
      gravDir = g.flipsTo;
    }
  }

  // Spikes
  for (const sg of (L.spikes||[])) {
    for (let i = 0; i < sg.count; i++) {
      const sx = sg.x + i * 16, sy = sg.onCeiling ? sg.y : sg.y;
      if (rectOverlap(player.x+2, player.y+2, player.w-4, player.h-4, sx+2, sy+2, 12, 12)) {
        killPlayer(); return;
      }
    }
  }

  // Saws
  for (const s of liveSaws) {
    const dx = player.x + player.w/2 - s.cx;
    const dy = player.y + player.h/2 - s.cy;
    if (Math.sqrt(dx*dx + dy*dy) < s.r + 6) { killPlayer(); return; }
  }

  // Arrows
  for (const a of liveArrows) {
    if (rectOverlap(player.x+1, player.y+1, player.w-2, player.h-2, a.x-4, a.y-3, 18, 6)) {
      killPlayer(); return;
    }
  }

  // Crushers
  for (const c of liveCrushers) {
    if (rectOverlap(player.x, player.y, player.w, player.h, c.x, c.cy, c.w, c.h)) {
      killPlayer(); return;
    }
  }

  // Door
  const door = L.door;
  if (rectOverlap(player.x, player.y, player.w, player.h, door.x, door.y, 30, 46)) {
    winLevel();
  }
}

function updateObstacles() {
  const L = LEVELS[state.level];
  frameCount++;

  // Moving platforms
  liveMovPlatforms.forEach(p => {
    if (p.fall) {
      if (!p.fallen) {
        // check if player is on it
        const onIt = rectOverlap(player.x, player.y + player.h - 2, player.w, 4, p.cx, p.cy, p.w, p.h);
        if (onIt) p.fallTimer++;
        else p.fallTimer = 0;
        if (p.fallTimer > 30) { p.falling = true; }
        if (p.falling) { p.cy += 4; if (p.cy > H + 50) p.fallen = true; }
      }
    } else {
      if (p.dx) {
        p.cx += p.dx;
        const ox = p.ox || p.x;
        if (Math.abs(p.cx - ox) > p.range) p.dx = -p.dx;
      }
      if (p.dy) {
        p.cy += p.dy;
        const oy = p.oy || p.y;
        if (Math.abs(p.cy - oy) > p.range) p.dy = -p.dy;
      }
    }
  });

  // Crushers
  liveCrushers.forEach(c => {
    c.t = (c.t + c.speed) % (c.range * 2);
    const t = c.t;
    c.cy = c.oy + (t < c.range ? t : c.range*2 - t);
  });

  // Saws
  liveSaws.forEach(s => {
    s.angle += 0.08;
    if (s.axis === 'h') {
      s.cx += s.speed;
      if (Math.abs(s.cx - s.ox) > s.range) s.speed = -s.speed;
    }
  });

  // Arrows
  liveArrows = liveArrows.filter(a => a.x > -30 && a.x < W + 30);
  (L.arrows||[]).forEach(def => {
    def.timer = (def.timer + 1);
    if (def.timer >= def.interval) {
      def.timer = 0;
      liveArrows.push({x: def.dir==='right' ? -10 : W+10, y: def.y, dir: def.dir, speed: def.speed});
    }
  });
  liveArrows.forEach(a => { a.x += a.dir === 'right' ? a.speed : -a.speed; });

  // Hidden platform timers
  liveHiddenPlatforms.forEach(p => {
    if (p.revealed && p.revTimer > 0) p.revTimer--;
    if (p.revTimer <= 0) p.revealed = false;
  });
}

function killPlayer(isRestart=false) {
  if (player.dead) return;
  player.dead = true;
  player.squish = 0.2;
  state.deaths++;
  state.totalDeaths++;
  gameActive = false;

  setTimeout(() => {
    const screen = document.getElementById('deathScreen');
    document.getElementById('deathMsg').textContent = isRestart ? "RESTARTED" : DEATH_MSGS[Math.floor(Math.random()*DEATH_MSGS.length)];
    document.getElementById('deathHint').textContent = `DEATHS THIS LEVEL: ${state.deaths}`;
    screen.style.display = 'flex';
  }, 400);
}

function winLevel() {
  if (player.won) return;
  player.won = true;
  gameActive = false;
  clearInterval(timerInterval);

  const elapsed = Math.floor((Date.now() - state.startTime)/1000);
  setTimeout(() => {
    if (state.level >= LEVELS.length - 1) {
      document.getElementById('allClearStats').textContent =
        `TOTAL DEATHS: ${state.totalDeaths}  |  LEVELS: ${LEVELS.length}`;
      document.getElementById('allClearScreen').style.display = 'flex';
    } else {
      document.getElementById('winStats').textContent =
        `TIME: ${elapsed}s  |  DEATHS: ${state.deaths}`;
      document.getElementById('winScreen').style.display = 'flex';
    }
  }, 300);
}

// ─── DRAWING ────────────────────────────────────────────────
function draw() {
  const L = LEVELS[state.level];
  ctx.clearRect(0, 0, W, H);

  // Background
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, L.bg);
  grad.addColorStop(1, shadeColor(L.bg, -30));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(255,200,100,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 32) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Static platforms
  (L.platforms||[]).forEach(p => drawPlatform(p.x, p.y, p.w, p.h));

  // Hidden platforms
  liveHiddenPlatforms.forEach(p => {
    if (p.revealed) {
      ctx.globalAlpha = Math.min(1, p.revTimer / 30);
      drawPlatform(p.x, p.y, p.w, p.h, true);
      ctx.globalAlpha = 1;
    }
  });

  // Moving platforms
  liveMovPlatforms.filter(p => !p.fallen).forEach(p => drawPlatform(p.cx, p.cy, p.w, p.h, false, true));

  // Grav pads
  (liveGravPads||[]).forEach(g => {
    ctx.fillStyle = '#2255ff';
    ctx.fillRect(g.x, g.y, 24, 16);
    ctx.fillStyle = '#aaccff';
    ctx.font = '9px monospace';
    ctx.fillText(g.flipsTo === -1 ? '↑' : '↓', g.x+7, g.y+12);
  });

  // Door
  drawDoor(L.door.x, L.door.y);

  // Spikes
  (L.spikes||[]).forEach(sg => {
    for (let i = 0; i < sg.count; i++) drawSpike(sg.x + i*16, sg.y, sg.onCeiling);
  });

  // Saws
  liveSaws.forEach(s => drawSaw(s.cx, s.cy, s.r, s.angle));

  // Arrows
  liveArrows.forEach(a => drawArrow(a.x, a.y, a.dir));

  // Crushers
  liveCrushers.forEach(c => drawCrusher(c.x, c.cy, c.w, c.h));

  // Player
  drawPlayer();

  // Death effect
  if (player.dead && player.deathTimer < 20) {
    player.deathTimer++;
    ctx.fillStyle = `rgba(255,50,0,${0.3 * (1 - player.deathTimer/20)})`;
    ctx.fillRect(0,0,W,H);
  }
}

function drawPlatform(x, y, w, h, isHidden=false, isMoving=false) {
  const topH = Math.min(10, h);
  ctx.fillStyle = isHidden ? '#ddcc88' : isMoving ? '#f0b040' : PAL.platform;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = isMoving ? '#ffdd88' : '#f0c060';
  ctx.fillRect(x, y, w, topH);
  ctx.fillStyle = isMoving ? '#d09020' : PAL.platformDark;
  ctx.fillRect(x, y+h-4, w, 4);
  // Pixel edge
  ctx.fillStyle = 'rgba(255,220,100,0.3)';
  ctx.fillRect(x, y, w, 2);
}

function drawDoor(x, y) {
  ctx.fillStyle = PAL.doorFrame;
  ctx.fillRect(x-3, y-3, 36, 52);
  ctx.fillStyle = PAL.door;
  ctx.fillRect(x, y, 30, 46);
  // Handle
  ctx.fillStyle = '#ffcc44';
  ctx.fillRect(x+22, y+22, 5, 5);
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(x+3, y+3, 10, 20);
}

function drawSpike(x, y, onCeiling=false) {
  ctx.fillStyle = PAL.spike;
  ctx.beginPath();
  if (!onCeiling) {
    ctx.moveTo(x, y+16);
    ctx.lineTo(x+8, y);
    ctx.lineTo(x+16, y+16);
  } else {
    ctx.moveTo(x, y);
    ctx.lineTo(x+8, y+16);
    ctx.lineTo(x+16, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = PAL.spikeHi;
  ctx.beginPath();
  if (!onCeiling) {
    ctx.moveTo(x+6, y+16);
    ctx.lineTo(x+8, y+2);
    ctx.lineTo(x+10, y+16);
  } else {
    ctx.moveTo(x+6, y);
    ctx.lineTo(x+8, y+14);
    ctx.lineTo(x+10, y);
  }
  ctx.closePath();
  ctx.fill();
}

function drawSaw(cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  // Teeth
  const teeth = 8;
  ctx.fillStyle = '#bbbbbb';
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a1 = (i/teeth) * Math.PI*2;
    const a2 = ((i+0.5)/teeth) * Math.PI*2;
    const a3 = ((i+1)/teeth) * Math.PI*2;
    ctx.lineTo(Math.cos(a1)*r*0.75, Math.sin(a1)*r*0.75);
    ctx.lineTo(Math.cos(a2)*r, Math.sin(a2)*r);
    ctx.lineTo(Math.cos(a3)*r*0.75, Math.sin(a3)*r*0.75);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(0, 0, r*0.35, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#aaa';
  ctx.beginPath();
  ctx.arc(0, 0, r*0.15, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawArrow(x, y, dir) {
  const facing = dir === 'right' ? 1 : -1;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = PAL.arrow;
  ctx.beginPath();
  ctx.moveTo(facing * 12, 0);
  ctx.lineTo(facing * -4, -5);
  ctx.lineTo(facing * -4, 5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#664400';
  ctx.fillRect(facing * -12, -2, facing * 8, 4);
  ctx.restore();
}

function drawCrusher(x, y, w, h) {
  ctx.fillStyle = '#884422';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#cc6633';
  ctx.fillRect(x, y, w, 6);
  // Spikes on bottom
  const sk = 4;
  for (let i = 0; i < w/16; i++) {
    const sx = x + i*16;
    ctx.fillStyle = PAL.spike;
    ctx.beginPath();
    ctx.moveTo(sx, y+h);
    ctx.lineTo(sx+8, y+h+14);
    ctx.lineTo(sx+16, y+h);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPlayer() {
  if (player.dead && player.deathTimer > 5) return;

  const px = player.x + player.w/2;
  const py = player.y + player.h/2;
  const scaleX = player.facingRight ? 1 : -1;
  const scaleY = player.squish;
  const scaleXComp = 1/Math.max(0.5, scaleY); // compensate width for squish

  ctx.save();
  ctx.translate(px, py);
  ctx.scale(scaleX * scaleXComp, scaleY);
  ctx.translate(-player.w/2, -player.h/2);

  const w = player.w, h = player.h;

  // Body
  ctx.fillStyle = '#111';
  ctx.fillRect(3, 10, w-6, h-14);

  // Head
  ctx.fillStyle = '#222';
  ctx.fillRect(2, 0, w-4, 11);
  // Eyes
  ctx.fillStyle = '#ff4400';
  ctx.fillRect(4, 3, 3, 2);
  ctx.fillRect(w-7, 3, 3, 2);

  // Legs (walk frames)
  const legPhase = player.walkFrame;
  ctx.fillStyle = '#111';
  if (legPhase === 0 || !player.onGround) {
    ctx.fillRect(3, h-4, 4, 4);
    ctx.fillRect(w-7, h-4, 4, 4);
  } else if (legPhase === 1) {
    ctx.fillRect(2, h-4, 4, 4);
    ctx.fillRect(w-6, h-6, 4, 6);
  } else if (legPhase === 2) {
    ctx.fillRect(3, h-4, 4, 4);
    ctx.fillRect(w-7, h-4, 4, 4);
  } else {
    ctx.fillRect(2, h-6, 4, 6);
    ctx.fillRect(w-6, h-4, 4, 4);
  }

  ctx.restore();
}

function shadeColor(col, amt) {
  let r = parseInt(col.slice(1,3),16)+amt;
  let g = parseInt(col.slice(3,5),16)+amt;
  let b = parseInt(col.slice(5,7),16)+amt;
  r = Math.max(0,Math.min(255,r)).toString(16).padStart(2,'0');
  g = Math.max(0,Math.min(255,g)).toString(16).padStart(2,'0');
  b = Math.max(0,Math.min(255,b)).toString(16).padStart(2,'0');
  return `#${r}${g}${b}`;
}

// ─── GAME LOOP ──────────────────────────────────────────────
function gameLoop() {
  if (state.screen === 'game') {
    updateObstacles();
    updatePlayer();
    draw();
    document.getElementById('levelLabel').textContent = `LEVEL ${state.level+1}`;
    document.getElementById('deathCount').textContent = `💀 ${state.deaths}`;
  }
  requestAnimationFrame(gameLoop);
}

// ─── SCREENS ────────────────────────────────────────────────
function showScreen(id) {
  ['titleScreen','levelScreen','deathScreen','winScreen','allClearScreen'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  if (id) document.getElementById(id).style.display = 'flex';
  state.screen = id ? id.replace('Screen','') : 'game';
}

function buildLevelSelect() {
  const cont = document.getElementById('levelBtns');
  cont.innerHTML = '';
  LEVELS.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lvlBtn';
    b.textContent = i+1;
    b.title = l.name;
    b.onclick = () => {
      state.level = i;
      state.totalDeaths = 0;
      showScreen(null);
      initLevel();
    };
    cont.appendChild(b);
  });
}

// Buttons
document.getElementById('startBtn').onclick = () => {
  state.level = 0; state.totalDeaths = 0;
  showScreen(null); initLevel();
};
document.getElementById('levelsBtn').onclick = () => { buildLevelSelect(); showScreen('levelScreen'); };
document.getElementById('backBtn').onclick   = () => showScreen('titleScreen');
document.getElementById('retryBtn').onclick  = () => { showScreen(null); resetPlayer(); state.deaths--; state.deaths=Math.max(0,state.deaths); gameActive=true; state.startTime=Date.now(); };
document.getElementById('menuBtn2').onclick  = () => { showScreen('titleScreen'); clearInterval(timerInterval); };
document.getElementById('nextBtn').onclick   = () => { state.level++; showScreen(null); initLevel(); };
document.getElementById('menuBtn3').onclick  = () => { showScreen('titleScreen'); clearInterval(timerInterval); };
document.getElementById('playAgainBtn').onclick = () => { state.level=0; state.totalDeaths=0; showScreen(null); initLevel(); };

// ─── BOOT ───────────────────────────────────────────────────
showScreen('titleScreen');
gameLoop();
</script>
